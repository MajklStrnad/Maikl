      as="image"

      type="image/webp"
      media="(min-width: 769px)"
    />

    <link
      rel="preload"
      as="image"
      href="/blooming-mobile.webp"

    />
    <link
      rel="preload"
      as="image"

      type="image/webp"
      media="(max-width: 768px)"
    />
