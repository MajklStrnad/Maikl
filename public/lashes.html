<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibrant Interactive Eyes</title>
    <style>
        :root {
            --iris-base: #002244;
            --iris-mid: #0066cc;
            --iris-light: #3399ff;
        }
        body {
            display: flex;
            margin: 0;
            background-color: #b8b2c2;
            font-family: 'Inter', system-ui, sans-serif;
            height: 100vh;
            overflow: hidden;
        }
        .sidebar {
            width: 280px;
            background: #b8b2c2;
            border-right: 1px solid #eee;
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            gap: 30px;
            z-index: 10;
            box-shadow: 10px 0 30px rgba(0,0,0,0.02);
        }
        .sidebar h2 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #999;
            margin: 0;
        }
        .color-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .color-opt {
            height: 50px;
            border-radius: 12px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 500;
        }
        .color-opt:hover { transform: translateX(5px); }
        .color-opt.active { border-color: #333; }
        
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #c4b3a8;
        }
        .container {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .eye-box {
            width: 400px;
            height: 400px;
            position: relative;
            background: #c4b3a8;
        }
        svg { width: 100%; height: 100%; }
        .mirrored { transform: scaleX(-1); }
        .pupil-group { transition: transform 0.1s ease-out; }
        .pupil-dot { transition: r 0.35s cubic-bezier(.34,1.56,.64,1); transform-box: fill-box; transform-origin: center; }
        .static-group path, .brow-group path { fill: #7d6b5d; }
        .eye-box > svg { position: absolute; inset: 0; opacity: 1; }
        .eye-box .eye-closed { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; pointer-events: none; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Select Color</h2>
        <div class="color-grid">
            <div class="color-opt active" style="background: #0066cc; color: white;" onclick="setColor('blue')">Blue</div>
            <div class="color-opt" style="background: #008080; color: white;" onclick="setColor('cyan')">Cyan</div>
            <div class="color-opt" style="background: #994d00; color: white;" onclick="setColor('amber')">Amber</div>
            <div class="color-opt" style="background: #004d00; color: white;" onclick="setColor('green')">Green</div>
                    </div>
    </div>

    <div class="main-content">
        <div class="container">
            <svg style="width:0; height:0; position:absolute;">

                        <stop offset="28%" stop-color="#000000" />
                        <stop offset="35%" stop-color="var(--iris-base)" />
                        <stop offset="65%" stop-color="var(--iris-mid)" />
                        <stop offset="95%" stop-color="var(--iris-light)" />
                        <stop offset="100%" stop-color="var(--iris-base)" />
                    </radialGradient>
                </defs>
            </svg>

    <script>
        const colors = {
            blue: { base: '#002244', mid: '#0066cc', light: '#3399ff' },
            cyan: { base: '#003333', mid: '#008080', light: '#00cccc' },
            amber: { base: '#331a00', mid: '#994d00', light: '#cc6600' },
            green: { base: '#001a00', mid: '#004d00', light: '#008000' },
        };

        function setColor(name) {
            const root = document.documentElement;
            const theme = colors[name];
            root.style.setProperty('--iris-base', theme.base);
            root.style.setProperty('--iris-mid', theme.mid);
            root.style.setProperty('--iris-light', theme.light);
            
            document.querySelectorAll('.color-opt').forEach(opt => opt.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }

        const pupils = document.querySelectorAll('.pupil-group');
        const container = document.querySelector('.container');
        const eyeBoxes = document.querySelectorAll('.eye-box');

        // Render pupils BENEATH the eyelid/lash artwork so the iris never overlaps the lashes.
        // SVG has no z-index; paint order = DOM order. So move .pupil-group before .static-group.
        document.querySelectorAll('.eye-box svg').forEach(svg => {
            const pupil = svg.querySelector('.pupil-group');
            const staticG = svg.querySelector('.static-group');
            if (pupil && staticG && staticG.parentNode) {
                staticG.parentNode.insertBefore(pupil, staticG);
            }
        });

        document.addEventListener('mousemove', (e) => {
            const containerRect = container.getBoundingClientRect();
            const centerX = containerRect.left + containerRect.width / 2;
            const centerY = containerRect.top + containerRect.height / 2;
            
            const dx = e.clientX - centerX;
            const dy = e.clientY - centerY;
            
            const angle = Math.atan2(dy, dx);
            const maxDistance = 20; 
            const distance = Math.min(Math.hypot(dx, dy) / 20, maxDistance);
            
            const moveX = Math.cos(angle) * distance * 10;
            const moveY = -Math.sin(angle) * distance * 10;
            
            eyeBoxes.forEach((box, index) => {
                const pupil = pupils[index];
                const finalX = box.classList.contains('mirrored') ? -moveX : moveX;
                pupil.style.transform = `translate(${finalX}px, ${moveY}px)`;
            });
        });

        // Blink: multi-frame smooth crossfade between open (SVG) and closed (PNG)
        // Uses the Web Animations API with many keyframes for buttery motion,
        // plus a subtle scaleY squash to mimic the eyelid arc.
        const openEls   = Array.from(document.querySelectorAll('.eye-box > svg'));
        const closedEls = Array.from(document.querySelectorAll('.eye-box > .eye-closed'));

        openEls.concat(closedEls).forEach(el => { el.style.transformOrigin = '50% 50%'; });

        // Frames: t (0..1), openOpacity, closedOpacity, scaleY
        // Sequence: open -> mid blend (squashing) -> fully closed -> hold closed -> open back
        const blinkFrames = [
            { t: 0.00, o: 1.00, c: 0.00, s: 1.00 },
            { t: 0.08, o: 0.85, c: 0.15, s: 0.98 },
            { t: 0.16, o: 0.55, c: 0.55, s: 0.93 },
            { t: 0.24, o: 0.20, c: 0.90, s: 0.88 },
            { t: 0.30, o: 0.00, c: 1.00, s: 0.86 },
            { t: 0.55, o: 0.00, c: 1.00, s: 0.86 }, // hold closed
            { t: 0.63, o: 0.15, c: 0.95, s: 0.90 },
            { t: 0.72, o: 0.45, c: 0.65, s: 0.95 },
            { t: 0.82, o: 0.80, c: 0.25, s: 0.98 },
            { t: 0.92, o: 0.95, c: 0.05, s: 0.995 },
            { t: 1.00, o: 1.00, c: 0.00, s: 1.00 },
        ];

        function animateEls(els, prop, frames, duration) {
            return Promise.all(els.map(el => {
                const kf = frames.map(f => ({
                    offset: f.t,
                    opacity: String(f[prop]),
                    transform: `scaleY(${f.s})`,
                }));
                return el.animate(kf, {
                    duration,
                    easing: 'linear', // smoothness comes from many keyframes
                    fill: 'forwards',
                }).finished;
            }));
        }

        function hold(ms) { return new Promise(r => setTimeout(r, ms)); }

        async function blink(duration = 850) {
            await Promise.all([
                animateEls(openEls,   'o', blinkFrames, duration),
                animateEls(closedEls, 'c', blinkFrames, duration),
            ]);
        }

        (async function loop() {
            while (true) {
                await hold(6000 + Math.random() * 5000);
                await blink();
                // ~15% chance of a quick double-blink (wink style)
                if (Math.random() < 0.15) {
                    await hold(80);
                    await blink(350); // snappy wink
                }
            }
        })();

        // Click anywhere → pupils dilate, then return
        const pupilDots = document.querySelectorAll('.pupil-dot');
        const PUPIL_BASE_R = 160;
        const PUPIL_DILATED_R = 320;
        document.addEventListener('click', () => {
            pupilDots.forEach(p => p.setAttribute('r', PUPIL_DILATED_R));
            setTimeout(() => {
                pupilDots.forEach(p => p.setAttribute('r', PUPIL_BASE_R));
            }, 900);
        });
    </script>
