const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

let W, H;
let scrollY = 0;
let particles = [];

function rand(a, b)  { return a + Math.random() * (b - a); }
function randn() {
  let u, v;
  do { u = Math.random(); } while (!u);
  do { v = Math.random(); } while (!v);
  return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
}

function initParticles() {
  const cx = W/2, cy = H/2;
  particles = [];

  const galaxyScaleFactor = 1.25;
  
  // Galaxy Particles
  for (let arm = 0; arm < 3; arm++) {
    const base = (arm/3)*Math.PI*2;
    for (let i = 0; i < 1800; i++) {
      const t     = rand(.03,1.0);
      const angle = base + t*3.1*Math.PI + randn()*.19;
      const spr   = Math.abs(randn())*26*(1-t*.3);
      const rad   = (t*Math.min(W,H)*.54 + randn()*6) * galaxyScaleFactor;
      
      const distFromCenter = rad;
      const baseAngle = angle;
      const spread = spr * (Math.random()<.5?1:-1);

      const dist  = Math.hypot(rad, spr);
      const brt   = rand(.2,.95)*(.4+Math.max(0,1-dist/(Math.min(W,H)*.54*galaxyScaleFactor))*.7);
      
      const rnd   = Math.random();
      let hue=220,sat=20;
      if      (rnd<.48){hue=rand(210,245);sat=rand(15,40);}
      else if (rnd<.72){hue=0;sat=0;}
      else             {hue=rand(25,52);sat=rand(30,70);}
      
      const sz = (Math.random()<.95?rand(.2,.9):rand(1.0,2.2)) * 1.1;
      let col;
      if (sat===0||sat<1) col=`rgba(245,250,255,${brt})`;
      else col=`hsla(${hue},${sat}%,95%,${brt})`;

      particles.push({
        dist: distFromCenter, angle: baseAngle, spr: spread,
        tx: 0, ty: 0, tsz: sz, // Target size
        sz: sz, col: col, targetCol: '#ffffff',
        phX: Math.random() * Math.PI * 2, phY: Math.random() * Math.PI * 2, amp: rand(1, 3)
      });
    }
  }

  // Bulge
  for (let i = 0; i < 1800; i++) {
    const angle = rand(0,Math.PI*2);
    const d     = (Math.abs(randn())*36+Math.abs(randn())*16) * galaxyScaleFactor;
    const alpha = rand(.3,1.0)*Math.max(0,1-d/(110*galaxyScaleFactor));
    if (alpha<=0) continue;
    
    const rnd=Math.random();
    let hue=38,sat=35;
    if      (rnd<.55){hue=rand(28,55);sat=rand(20,55);}
    else if (rnd<.8) {hue=0;sat=0;}
    else             {hue=rand(200,235);sat=rand(15,35);}
    const r=rand(.25,1.1);
    let col;
    if (sat===0||sat<1) col=`rgba(250,252,255,${alpha})`;
    else col=`hsla(${hue},${sat}%,95%,${alpha})`;

    particles.push({
      dist: d, angle: angle, spr: 0,
      tx: 0, ty: 0, tsz: r,
      sz: r, col: col, targetCol: '#ffffff',
      phX: Math.random() * Math.PI * 2, phY: Math.random() * Math.PI * 2, amp: rand(1, 2)
    });
  }

  // Sharper & Thicker Logo mapping
  const logoScale = Math.min(W, H) * 0.45;
  const logoPoints = [];
  LOGO.white.forEach(p => logoPoints.push({x: p[0], y: p[1], col: '#ffffff', size: 0.9}));
  LOGO.cyan.forEach(p => logoPoints.push({x: p[0], y: p[1], col: '#35a8c9', size: 1.3}));

  // To make it thicker, we'll assign multiple particles to the same logo points but with slight offsets
  for (let i = 0; i < particles.length; i++) {
    const lp = logoPoints[i % logoPoints.length];
    
    // Add a tiny bit of random offset to "thicken" the lines
    const thicknessOffset = 0.004; 
    const ox = (Math.random() - 0.5) * thicknessOffset * logoScale;
    const oy = (Math.random() - 0.5) * thicknessOffset * logoScale;
    
    particles[i].tx = lp.x * logoScale + ox;
    particles[i].ty = -lp.y * logoScale + oy;
    particles[i].targetCol = lp.col;
    
    // Sharpen by making particles slightly bigger in logo state
    particles[i].tsz = lp.size * (0.8 + Math.random() * 0.4); 
  }
}

function draw() {
  const cx = W/2, cy = H/2;
  const scrollProgress = Math.min(Math.max(window.scrollY / (document.body.scrollHeight - window.innerHeight), 0), 1);
  ctx.fillStyle='#000';
  ctx.fillRect(0,0,W,H);

  const time = performance.now() * 0.001;
  const galaxyRotation = time * 0.15;
  const logoSpinAngle = time * 0.8;
  const floatY = Math.sin(time * 1.5) * 15;

  let phase, t;
  if (scrollProgress < 0.7) {
    phase = 1; t = scrollProgress / 0.7;
  } else {
    phase = 2; t = (scrollProgress - 0.7) / 0.3;
  }

  if (phase === 1) {
    const alpha = (1 - t) * 0.08;
    const g = ctx.createRadialGradient(cx,cy,60,cx,cy,Math.min(W,H)*.65);
    g.addColorStop(0,`rgba(70,70,140,${alpha})`);
    g.addColorStop(.55,`rgba(40,40,90,${alpha * 0.5})`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.save(); ctx.scale(1,.5);
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(cx,cy/.5,Math.min(W,H)*.65,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  particles.forEach(p => {
    const currentAngle = p.angle + galaxyRotation;
    const circleX = Math.cos(currentAngle) * p.dist + Math.cos(currentAngle + Math.PI/2) * p.spr;
    const circleY = Math.sin(currentAngle) * p.dist + Math.sin(currentAngle + Math.PI/2) * p.spr;
    const gx = cx + circleX;
    const gy = cy + circleY * 0.45;

    const liveX = Math.sin(time * 0.8 + p.phX) * p.amp;
    const liveY = Math.cos(time * 0.6 + p.phY) * p.amp;

    const lx = p.tx * Math.cos(logoSpinAngle);
    const lz = p.tx * Math.sin(logoSpinAngle);
    const scale = 1 + lz * 0.0005;
    const finalX = cx + lx * scale;
    const finalY = cy + p.ty * scale + floatY;

    let curX, curY, curCol, curSz;
    if (phase === 1) {
      const ease = t * t * (3 - 2 * t);
      curX = (gx + liveX) * (1 - ease) + finalX * ease;
      curY = (gy + liveY) * (1 - ease) + finalY * ease;
      curCol = (t > 0.5) ? p.targetCol : p.col;
      curSz = p.sz * (1 - ease) + p.tsz * ease;
      ctx.globalAlpha = (t < 0.2) ? 1 : (t > 0.8) ? 1 : 0.6 + 0.4 * Math.abs(t - 0.5) * 2;
    } else {
      curX = finalX; curY = finalY; curCol = p.targetCol; curSz = p.tsz;
      ctx.globalAlpha = 1;
    }

    ctx.fillStyle = curCol;
    ctx.beginPath();
    ctx.arc(curX, curY, curSz, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  });

  requestAnimationFrame(draw);
}

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  initParticles();
}

window.addEventListener('resize', resize);
window.addEventListener('scroll', () => { scrollY = window.scrollY; });
resize();
draw();
</script>
</body>
