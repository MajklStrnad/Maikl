<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxy to Interactive Particle Sphere</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { background: #020108; }
  body {
    min-height: 560vh;
    overflow-x: hidden;
    background: #020108;
    color: #fff;
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  canvas#c {
    position: fixed;
    inset: 0;
    display: block;
    width: 100%;
    height: 100vh;
    z-index: 0;
  }
  .scroll-hint {
    position: fixed;
    left: 50%;
    bottom: 30px;
    z-index: 1;
    transform: translateX(-50%);
    color: rgba(255, 235, 247, 0.72);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    white-space: nowrap;
    pointer-events: none;
    transition: opacity 300ms ease;
    animation: bounce 2.3s ease-in-out infinite;
  }
  .scroll-hint::after {
    content: "";
    display: inline-block;
    width: 7px;
    height: 7px;
    margin: 0 0 2px 9px;
    border-right: 1px solid currentColor;
    border-bottom: 1px solid currentColor;
    transform: rotate(45deg);
  }
  @keyframes bounce {
    0%, 100% { transform: translate(-50%, 0); }
    50% { transform: translate(-50%, -7px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .scroll-hint { animation: none; }
  }
</style>
</head>
<body>
<canvas id="c" aria-label="A galaxy that transforms into an interactive 3D particle sphere as the page scrolls."></canvas>
<div class="scroll-hint" id="scrollHint">Scroll to bloom</div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });
  const hint = document.getElementById('scrollHint');

  let W = 0;
  let H = 0;
  let DPR = 1;
  let particles = [];
  let lastScroll = 0;

  const rand = (a, b) => a + Math.random() * (b - a);
  const choose = list => list[(Math.random() * list.length) | 0];
  const clamp = (value, min, max) => Math.min(Math.max(value, min), max);
  const mix = (a, b, t) => a + (b - a) * t;
  const smoothstep = t => t * t * (3 - 2 * t);
  const normal = () => {
    let u = 0;
    let v = 0;
    while (!u) u = Math.random();
    while (!v) v = Math.random();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  };

  function makeBranch(points, tips, x, y, angle, length, width, depth, bend) {
    const segments = Math.max(18, Math.round(length / 3.5));
    let lastX = x;
    let lastY = y;

    for (let i = 0; i <= segments; i++) {
      const t = i / segments;
      const curve = Math.sin(t * Math.PI) * bend;
      const px = x + Math.cos(angle) * length * t + Math.cos(angle + Math.PI / 2) * curve;
      const py = y + Math.sin(angle) * length * t + Math.sin(angle + Math.PI / 2) * curve;
      const localWidth = Math.max(1.5, width * (1 - t * 0.72));
      const scatter = (Math.random() - 0.5) * localWidth;
      const depthRadius = Math.max(2.5, localWidth * 0.82);
      points.push({
        x: px + Math.cos(angle + Math.PI / 2) * scatter,
        y: py + Math.sin(angle + Math.PI / 2) * scatter,
        z: normal() * depthRadius,
        size: rand(1.05, 2.25) * (1 - depth * 0.06),
        color: depth < 2 ? choose(['#68444b', '#795057', '#8c5e65']) : choose(['#86616a', '#9d747b', '#b38a90'])
      });
      lastX = px;
      lastY = py;
    }

    if (depth >= 4 || length < 28) {
      tips.push({ x: lastX, y: lastY, spread: Math.max(18, length * 0.34) });
      return;
    }

    const forkCount = depth === 0 ? 4 : (depth === 1 ? 3 : 2 + (Math.random() > 0.56 ? 1 : 0));
    for (let i = 0; i < forkCount; i++) {
      const start = rand(0.43, 0.91);
      const startX = x + Math.cos(angle) * length * start + Math.cos(angle + Math.PI / 2) * Math.sin(start * Math.PI) * bend;
      const startY = y + Math.sin(angle) * length * start + Math.sin(angle + Math.PI / 2) * Math.sin(start * Math.PI) * bend;
      const direction = i / Math.max(1, forkCount - 1) - 0.5;
      const forkAngle = angle + direction * rand(0.78, 1.25) + rand(-0.14, 0.14);
      const forkLength = length * rand(0.38, 0.62) * (1 - start * 0.22);
      makeBranch(
        points, tips, startX, startY, forkAngle, forkLength,
        width * 0.57, depth + 1, bend * rand(0.25, 0.58) + direction * length * 0.16
      );
    }
  }

  function makeBranch3D(points, tips, start, direction, length, width, depth) {
    const dirLength = Math.hypot(direction.x, direction.y, direction.z) || 1;
    const dir = {
      x: direction.x / dirLength,
      y: direction.y / dirLength,
      z: direction.z / dirLength
    };
    const reference = Math.abs(dir.y) > 0.86 ? { x: 1, y: 0, z: 0 } : { x: 0, y: 1, z: 0 };
    const side = {
      x: dir.y * reference.z - dir.z * reference.y,
      y: dir.z * reference.x - dir.x * reference.z,
      z: dir.x * reference.y - dir.y * reference.x
    };
    const sideLength = Math.hypot(side.x, side.y, side.z) || 1;
    side.x /= sideLength; side.y /= sideLength; side.z /= sideLength;
    const cross = {
      x: dir.y * side.z - dir.z * side.y,
      y: dir.z * side.x - dir.x * side.z,
      z: dir.x * side.y - dir.y * side.x
    };
    const segments = Math.max(16, Math.round(length / 3.4));
    let endpoint = { ...start };

    for (let i = 0; i <= segments; i++) {
      const t = i / segments;
      const taper = Math.max(1.2, width * (1 - t * 0.76));
      const radialA = normal() * taper * 0.42;
      const radialB = normal() * taper * 0.42;
      endpoint = {
        x: start.x + dir.x * length * t + side.x * radialA + cross.x * radialB,
        y: start.y + dir.y * length * t + side.y * radialA + cross.y * radialB,
        z: start.z + dir.z * length * t + side.z * radialA + cross.z * radialB
      };
      points.push({
        ...endpoint,
        size: rand(1.55, 3.05) * (1 - depth * 0.05),
        color: depth < 2 ? choose(['#4a2d35', '#654048', '#80535b']) : choose(['#80606a', '#9c7680', '#b28c93'])
      });
    }

    if (depth >= 4 || length < 28) {
      tips.push({ ...endpoint, spread: Math.max(18, length * 0.34) });
      return;
    }

    const forkCount = depth === 0 ? 6 : (depth === 1 ? 5 : 3 + (Math.random() > 0.52 ? 1 : 0));
    for (let i = 0; i < forkCount; i++) {
      const startT = rand(0.42, 0.9);
      const forkStart = {
        x: start.x + dir.x * length * startT,
        y: start.y + dir.y * length * startT,
        z: start.z + dir.z * length * startT
      };
      const azimuth = (i / forkCount) * Math.PI * 2 + rand(-0.34, 0.34) + depth * 0.7;
      const outward = {
        x: side.x * Math.cos(azimuth) + cross.x * Math.sin(azimuth),
        y: side.y * Math.cos(azimuth) + cross.y * Math.sin(azimuth),
        z: side.z * Math.cos(azimuth) + cross.z * Math.sin(azimuth)
      };
      const child = {
        x: dir.x * 0.46 + outward.x * 0.88,
        y: dir.y * 0.46 + outward.y * 0.88 - rand(0.02, 0.2),
        z: dir.z * 0.46 + outward.z * 0.88
      };
      makeBranch3D(points, tips, forkStart, child, length * rand(0.38, 0.62) * (1 - startT * 0.18), width * 0.56, depth + 1);
    }
  }

  function createTreeTargets(scale) {
    const branches = [];
    const tips = [];
    const trunkX = -scale * 0.035;
    const rootY = scale * 0.43;

    // Dense central core keeps the trunk broad, continuous, and readable from every angle.
    for (let i = 0; i < 1800; i++) {
      const t = Math.random();
      const taper = scale * (0.082 - t * 0.038);
      branches.push({
        x: trunkX + normal() * taper * 0.72 + Math.sin(t * Math.PI) * scale * 0.018,
        y: rootY - t * scale * 0.77,
        z: normal() * taper,
        size: rand(1.55, 3.15),
        color: choose(['#402830', '#52343d', '#67434b', '#79545b'])
      });
    }
    makeBranch3D(branches, tips, { x: trunkX, y: rootY, z: 0 }, { x: 0.02, y: -1, z: 0.02 }, scale * 0.77, scale * 0.095, 0);

    // Four independent low limbs radiate around the trunk, so the tree has a real 360-degree structure.
    makeBranch3D(branches, tips, { x: trunkX, y: scale * 0.20, z: 0 }, { x: -0.78, y: -0.28, z: 0.52 }, scale * 0.44, scale * 0.038, 1);
    makeBranch3D(branches, tips, { x: trunkX, y: scale * 0.15, z: 0 }, { x: 0.82, y: -0.22, z: 0.38 }, scale * 0.46, scale * 0.036, 1);
    makeBranch3D(branches, tips, { x: trunkX, y: scale * 0.04, z: 0 }, { x: -0.22, y: -0.18, z: -0.96 }, scale * 0.42, scale * 0.034, 1);
    makeBranch3D(branches, tips, { x: trunkX, y: scale * 0.01, z: 0 }, { x: 0.22, y: -0.18, z: 0.96 }, scale * 0.42, scale * 0.034, 1);

    const blossoms = [];
    const blossomColors = ['#c995a7', '#b98296', '#d2a8b5', '#ad788c', '#dfbbc4', '#ead8dc'];

    // Dense flower clouds around branch tips, plus a few soft interior blooms.
    for (let i = 0; i < 4200; i++) {
      const tip = choose(tips);
      const radius = Math.pow(Math.random(), 0.94) * tip.spread;
      const theta = rand(0, Math.PI * 2);
      const xStretch = rand(0.98, 1.25);
      blossoms.push({
        x: tip.x + Math.cos(theta) * radius * xStretch + normal() * 0.45,
        y: tip.y + Math.sin(theta) * radius * 0.58 + normal() * 0.45,
        z: Math.sin(theta) * radius * rand(0.68, 1.08) + normal() * radius * 0.34,
        size: Math.random() < 0.24 ? rand(1.85, 3.05) : rand(0.92, 1.92),
        color: choose(blossomColors),
        sway: rand(0.3, 1.3),
        phase: rand(0, Math.PI * 2)
      });
    }

    // A restrained halo rounds the canopy without hiding the organic branching beneath it.
    for (let i = 0; i < 850; i++) {
      const theta = rand(Math.PI * 1.06, Math.PI * 1.95);
      const radius = rand(scale * 0.18, scale * 0.46);
      blossoms.push({
        x: trunkX + Math.cos(theta) * radius * 1.26 + normal() * scale * 0.038,
        y: -scale * 0.08 + Math.sin(theta) * radius * 0.78 + normal() * scale * 0.03,
        z: Math.cos(theta) * radius * rand(0.58, 0.96) + normal() * radius * 0.46,
        size: rand(0.68, 1.72),
        color: choose(blossomColors),
        sway: rand(0.3, 1.2),
        phase: rand(0, Math.PI * 2)
      });
    }

    const falling = [];
    for (let i = 0; i < 650; i++) {
      const source = choose(tips);
      falling.push({
        x: source.x + rand(-source.spread, source.spread),
        y: source.y + rand(-scale * 0.05, scale * 0.10),
        z: rand(-scale * 0.32, scale * 0.32),
        drift: rand(-scale * 0.10, scale * 0.10),
        speed: rand(9, 22),
        offset: rand(0, scale * 0.73),
        size: rand(0.45, 1.35),
        color: choose(blossomColors),
        phase: rand(0, Math.PI * 2)
      });
    }

    return { branches, blossoms, falling };
  }

  function createFlowerTargets(scale) {
    const branches = [];
    const blossoms = [];
    const falling = [];
    const stemX = 0;
    const baseY = 0;
    const bloomY = -scale * 0.22;
    const bloomRadius = scale * 0.30;

    // No stem or leaves: the final target is only the floating flower head.
    for (let i = 0; i < 0; i++) {
      const t = Math.random();
      const radius = scale * (0.035 - t * 0.015);
      branches.push({
        x: stemX + normal() * radius,
        y: baseY + (bloomY - baseY) * t,
        z: normal() * radius * 1.15,
        size: rand(1.3, 2.7),
        color: choose(['#263b35', '#315148', '#426557', '#577365'])
      });
    }

    const leafDirections = [];
    for (const leaf of leafDirections) {
      const len = scale * rand(0.22, 0.34);
      for (let i = 0; i < 260; i++) {
        const t = i / 259;
        const width = Math.sin(t * Math.PI) * scale * 0.045;
        branches.push({
          x: stemX + leaf.x * len * t + normal() * width,
          y: bloomY + scale * 0.16 + leaf.y * len * t + normal() * width * 0.55,
          z: leaf.z * len * t + normal() * width,
          size: rand(0.8, 1.8),
          color: choose(['#466a58', '#5c7c65', '#78917a'])
        });
      }
    }

    // Six clean, pointed petals create a recognizable lily rather than a round flower.
    const petalColors = ['#8795f2', '#6f78d8', '#a9a5ff', '#5d63bd', '#bcb8ff', '#747fe5'];
    const petalCount = 6;
    for (let p = 0; p < petalCount; p++) {
      const angle = (p / petalCount) * Math.PI * 2 - Math.PI / 2;
      const dir = { x: Math.cos(angle), y: -0.34, z: Math.sin(angle) };
      const side = { x: -Math.sin(angle), y: 0, z: Math.cos(angle) };
      for (let i = 0; i < 1250; i++) {
        const u = Math.random();
        const v = Math.random();
        const petalWidth = Math.pow(Math.sin(u * Math.PI), 0.82) * scale * 0.145;
        const across = (v - 0.5) * petalWidth;
        const along = Math.pow(u, 0.92) * bloomRadius * 0.91;
        const lift = Math.sin(u * Math.PI) * scale * 0.105 + normal() * scale * 0.008;
        const thickness = normal() * scale * 0.018 + u * scale * 0.10;
        blossoms.push({
          x: stemX + dir.x * along + side.x * across + normal() * scale * 0.012,
          y: bloomY + lift + normal() * scale * 0.012,
          z: dir.z * along + side.z * across + thickness + scale * 0.12,
          size: Math.random() < 0.15 ? rand(1.5, 2.65) : rand(0.72, 1.65),
          color: choose(petalColors),
          sway: rand(0.15, 0.65),
          phase: rand(0, Math.PI * 2)
        });
      }
    }

    // A warm 3D pollen core gives the lily a strong center and depth cue.
    for (let i = 0; i < 1550; i++) {
      const theta = rand(0, Math.PI * 2);
      const phi = Math.acos(rand(-1, 1));
      const radius = Math.pow(Math.random(), 0.55) * scale * 0.115;
      blossoms.push({
        x: stemX + Math.sin(phi) * Math.cos(theta) * radius,
        y: bloomY + Math.cos(phi) * radius,
        z: Math.sin(phi) * Math.sin(theta) * radius,
        size: rand(0.8, 1.9),
        color: choose(['#d6caff', '#bcaeff', '#8f86ed', '#e8e2ff']),
        sway: rand(0.1, 0.3),
        phase: rand(0, Math.PI * 2)
      });
    }

    for (let i = 0; i < 520; i++) {
      const angle = rand(0, Math.PI * 2);
      falling.push({
        x: stemX + Math.cos(angle) * rand(bloomRadius * 0.5, bloomRadius * 1.5),
        y: bloomY + rand(-scale * 0.1, scale * 0.18),
        z: rand(-scale * 0.3, scale * 0.3),
        drift: rand(-scale * 0.08, scale * 0.08),
        speed: rand(7, 17),
        offset: rand(0, scale * 0.72),
        size: rand(0.45, 1.3),
        color: choose(petalColors),
        phase: rand(0, Math.PI * 2)
      });
    }
    return { branches, blossoms, falling };
  }

  function createJellyfishTargets(scale) {
    const branches = [];
    const blossoms = [];
    const falling = [];
    const centerX = 0;
    const domeY = -scale * 0.08;
    const domeRadius = scale * 0.30;
    const tentacleColors = ['#5268e3', '#6e82f5', '#8177e9', '#48b5dc', '#a496ff'];
    const domeColors = ['#9db5ff', '#b5aaff', '#7899f5', '#83d2ef', '#d0c7ff'];

    // Volumetric bell: a dense hemispherical shell plus a glowing internal core.
    for (let i = 0; i < 6200; i++) {
      const theta = rand(0, Math.PI * 2);
      const phi = rand(0, Math.PI * 0.54);
      const radius = domeRadius * (0.78 + Math.random() * 0.22);
      const shellNoise = normal() * scale * 0.012;
      blossoms.push({
        x: centerX + Math.sin(phi) * Math.cos(theta) * radius + shellNoise,
        y: domeY - Math.cos(phi) * radius * 0.78 + normal() * scale * 0.012,
        z: Math.sin(phi) * Math.sin(theta) * radius + shellNoise,
        size: Math.random() < 0.17 ? rand(1.9, 3.35) : rand(0.9, 2.1),
        color: choose(domeColors),
        sway: rand(0.08, 0.35),
        phase: rand(0, Math.PI * 2)
      });
    }
    for (let i = 0; i < 2500; i++) {
      const theta = rand(0, Math.PI * 2);
      const phi = Math.acos(rand(-1, 1));
      const radius = Math.pow(Math.random(), 0.5) * domeRadius * 0.72;
      blossoms.push({
        x: Math.sin(phi) * Math.cos(theta) * radius,
        y: domeY + Math.cos(phi) * radius * 0.6,
        z: Math.sin(phi) * Math.sin(theta) * radius,
        size: rand(0.38, 1.15),
        color: choose(['#5268d8', '#6a78e5', '#8c87ee', '#5cc1dc']),
        sway: rand(0.1, 0.4),
        phase: rand(0, Math.PI * 2)
      });
    }

    // Compact underside connectors close the bell-to-tentacle transition with no visible gap.
    for (let i = 0; i < 1500; i++) {
      const theta = rand(0, Math.PI * 2);
      const radius = domeRadius * rand(0.35, 0.9);
      branches.push({
        x: Math.cos(theta) * radius,
        y: domeY + domeRadius * rand(0.12, 0.24),
        z: Math.sin(theta) * radius * 0.72,
        size: rand(0.9, 1.95),
        color: choose(tentacleColors)
      });
    }

    // Eight clearly separated tentacles curve down and outward through real 3D space.
    for (let t = 0; t < 8; t++) {
      const angle = (t / 8) * Math.PI * 2 + rand(-0.16, 0.16);
      const startRadius = domeRadius * rand(0.48, 0.82);
      const length = scale * rand(0.46, 0.68);
      const segments = 95;
      for (let i = 0; i < 900; i++) {
        const u = Math.random();
        const wave = Math.sin(u * Math.PI * rand(1.5, 2.1) + t) * scale * rand(0.018, 0.042);
        const radial = startRadius + u * scale * rand(0.035, 0.10) + wave;
        const x = Math.cos(angle) * radial + Math.cos(angle + Math.PI / 2) * wave;
        const y = domeY + domeRadius * 0.12 + u * length + normal() * scale * 0.006;
        const z = Math.sin(angle) * radial + Math.sin(angle + Math.PI / 2) * wave;
        branches.push({
          x: x + normal() * scale * 0.006,
          y,
          z: z + normal() * scale * 0.006,
          size: rand(1.2, 2.6) * (1 - u * 0.18),
          color: choose(tentacleColors),
          wavePhase: t * 0.9 + rand(-0.35, 0.35),
          waveAmount: rand(scale * 0.04, scale * 0.085)
        });
      }
      void segments;
    }

    for (let i = 0; i < 420; i++) {
      const theta = rand(0, Math.PI * 2);
      const radius = rand(domeRadius * 0.55, scale * 0.70);
      falling.push({
        x: Math.cos(theta) * radius,
        y: domeY + rand(-scale * 0.2, scale * 0.72),
        z: Math.sin(theta) * radius,
        drift: rand(-scale * 0.08, scale * 0.08),
        speed: rand(3, 9),
        offset: rand(0, scale * 0.8),
        size: rand(0.35, 1.1),
        color: choose(['#7edbf0', '#a79bff', '#718df1']),
        phase: rand(0, Math.PI * 2)
      });
    }
    return { branches, blossoms, falling };
  }

  function createDiamondTargets(scale) {
    const branches = [];
    const blossoms = [];
    const falling = [];
    const halfWidth = scale * 0.30;
    const topY = -scale * 0.38;
    const girdleY = scale * 0.02;
    const bottomY = scale * 0.42;
    const faceColors = ['#7c8cff', '#9aa5ff', '#5e72e8', '#b9b8ff', '#647bdc', '#8ec7f5'];

    const top = { x: 0, y: topY, z: 0 };
    const bottom = { x: 0, y: bottomY, z: 0 };
    const ring = [];
    const ringCount = 8;
    for (let i = 0; i < ringCount; i++) {
      const angle = (i / ringCount) * Math.PI * 2 + Math.PI / 8;
      ring.push({
        x: Math.cos(angle) * halfWidth,
        y: girdleY + Math.sin(angle * 2) * scale * 0.018,
        z: Math.sin(angle) * halfWidth * 0.72
      });
    }

    const addEdge = (a, b, count, colors) => {
      for (let i = 0; i < count; i++) {
        const t = i / Math.max(1, count - 1);
        branches.push({
          x: a.x + (b.x - a.x) * t + normal() * scale * 0.004,
          y: a.y + (b.y - a.y) * t + normal() * scale * 0.004,
          z: a.z + (b.z - a.z) * t + normal() * scale * 0.004,
          size: rand(1.1, 2.45),
          color: choose(colors)
        });
      }
    };

    // Strong crystalline outline: top facets, bottom facets, and the girdle.
    for (let i = 0; i < ringCount; i++) {
      addEdge(top, ring[i], 150, ['#c2c8ff', '#93a5ff', '#7b8ff5']);
      addEdge(bottom, ring[i], 125, ['#596fd5', '#7589e8', '#9b9fff']);
      addEdge(ring[i], ring[(i + 1) % ringCount], 120, ['#667ce2', '#a6b2ff', '#84c7ef']);
    }

    const addFace = (a, b, c, count, colors, lower = false) => {
      for (let i = 0; i < count; i++) {
        const u = Math.random();
        const v = Math.random() * (1 - u);
        const w = 1 - u - v;
        const depth = normal() * scale * 0.012;
        blossoms.push({
          x: a.x * u + b.x * v + c.x * w + depth,
          y: a.y * u + b.y * v + c.y * w + depth,
          z: a.z * u + b.z * v + c.z * w + depth,
          size: Math.random() < 0.12 ? rand(1.35, 2.4) : rand(0.48, 1.35),
          color: choose(colors),
          sway: lower ? rand(0.04, 0.16) : rand(0.02, 0.1),
          phase: rand(0, Math.PI * 2)
        });
      }
    };

    for (let i = 0; i < ringCount; i++) {
      const next = ring[(i + 1) % ringCount];
      addFace(top, ring[i], next, 460, [faceColors[i % faceColors.length], '#aab4ff', '#8297f5']);
      addFace(bottom, next, ring[i], 340, [faceColors[(i + 2) % faceColors.length], '#526dd4', '#7f8eea'], true);
    }

    // A compact internal refraction core makes the diamond glow from within.
    for (let i = 0; i < 1600; i++) {
      const theta = rand(0, Math.PI * 2);
      const phi = Math.acos(rand(-1, 1));
      const radius = Math.pow(Math.random(), 0.55) * scale * 0.17;
      blossoms.push({
        x: Math.sin(phi) * Math.cos(theta) * radius,
        y: girdleY + Math.cos(phi) * radius * 1.25,
        z: Math.sin(phi) * Math.sin(theta) * radius,
        size: rand(0.5, 1.65),
        color: choose(['#d9ddff', '#b9c7ff', '#8bd5ff', '#ffffff']),
        sway: rand(0.02, 0.12),
        phase: rand(0, Math.PI * 2)
      });
    }

    for (let i = 0; i < 360; i++) {
      const angle = rand(0, Math.PI * 2);
      const radius = rand(halfWidth * 1.08, halfWidth * 1.7);
      falling.push({
        x: Math.cos(angle) * radius,
        y: rand(topY, bottomY),
        z: Math.sin(angle) * radius,
        drift: rand(-scale * 0.035, scale * 0.035),
        speed: rand(2, 6),
        offset: rand(0, scale * 0.8),
        size: rand(0.35, 1.05),
        color: choose(['#9fb4ff', '#7dd7ff', '#b3aaff']),
        phase: rand(0, Math.PI * 2)
      });
    }
    return { branches, blossoms, falling };
  }

  function createSphereTargets(scale) {
    const branches = [];
    const blossoms = [];
    const falling = [];
    const radius = scale * 0.31;
    const colors = ['#b88f9d', '#c6a3ad', '#9d7e91', '#d1b4bb', '#8f7187', '#e0c6c8'];

    // Evenly distributed surface particles keep the sphere round, clean, and unmistakable.
    for (let i = 0; i < 9800; i++) {
      const y = rand(-1, 1);
      const theta = rand(0, Math.PI * 2);
      const ring = Math.sqrt(Math.max(0, 1 - y * y));
      const shell = radius * (0.965 + Math.random() * 0.035);
      blossoms.push({
        x: Math.cos(theta) * ring * shell,
        y: y * shell,
        z: Math.sin(theta) * ring * shell,
        size: Math.random() < 0.08 ? rand(1.6, 2.7) : rand(0.58, 1.5),
        color: choose(colors),
        sway: rand(0.02, 0.12),
        phase: rand(0, Math.PI * 2)
      });
    }
    // A restrained inner volume adds depth without making the outline fuzzy.
    for (let i = 0; i < 2200; i++) {
      const y = rand(-1, 1);
      const theta = rand(0, Math.PI * 2);
      const ring = Math.sqrt(Math.max(0, 1 - y * y));
      const inner = radius * Math.pow(Math.random(), 0.72) * 0.82;
      blossoms.push({
        x: Math.cos(theta) * ring * inner,
        y: y * inner,
        z: Math.sin(theta) * ring * inner,
        size: rand(0.35, 1.05),
        color: choose(['#856a7d', '#a98598', '#b795a0', '#735d75']),
        sway: rand(0.02, 0.09),
        phase: rand(0, Math.PI * 2)
      });
    }
    return { branches, blossoms, falling };
  }

  function initParticles() {
    particles = [];
    const shortest = Math.min(W, H);
    const galaxyScale = 1.25;

    // The original three-arm galaxy construction is kept as the starting formation.
    for (let arm = 0; arm < 3; arm++) {
      const base = (arm / 3) * Math.PI * 2;
      for (let i = 0; i < 1750; i++) {
        const t = rand(0.03, 1);
        const angle = base + t * 3.1 * Math.PI + normal() * 0.19;
        const spread = Math.abs(normal()) * 26 * (1 - t * 0.3) * (Math.random() < 0.5 ? 1 : -1);
        const dist = (t * shortest * 0.54 + normal() * 6) * galaxyScale;
        const brightness = rand(0.2, 0.95) * (0.4 + Math.max(0, 1 - Math.hypot(dist, spread) / (shortest * 0.54 * galaxyScale)) * 0.7);
        const pick = Math.random();
        let color;
        if (pick < 0.48) color = `hsla(${rand(210, 245)}, ${rand(15, 40)}%, 95%, ${brightness})`;
        else if (pick < 0.72) color = `rgba(245, 250, 255, ${brightness})`;
        else color = `hsla(${rand(25, 52)}, ${rand(30, 70)}%, 95%, ${brightness})`;
        particles.push({
          dist, angle, spread, size: (Math.random() < 0.95 ? rand(0.2, 0.9) : rand(1, 2.2)) * 1.1,
          color, orbitPhase: rand(0, Math.PI * 2), amp: rand(1, 3)
        });
      }
    }

    for (let i = 0; i < 1700; i++) {
      const angle = rand(0, Math.PI * 2);
      const dist = (Math.abs(normal()) * 36 + Math.abs(normal()) * 16) * galaxyScale;
      const alpha = rand(0.3, 1) * Math.max(0, 1 - dist / (110 * galaxyScale));
      if (alpha <= 0) continue;
      const pick = Math.random();
      const color = pick < 0.55
        ? `hsla(${rand(28, 55)}, ${rand(20, 55)}%, 95%, ${alpha})`
        : pick < 0.8
          ? `rgba(250, 252, 255, ${alpha})`
          : `hsla(${rand(200, 235)}, ${rand(15, 35)}%, 95%, ${alpha})`;
      particles.push({
        dist, angle, spread: 0, size: rand(0.25, 1.1), color,
        orbitPhase: rand(0, Math.PI * 2), amp: rand(1, 2)
      });
    }

    const tree = createSphereTargets(shortest * 0.88);
    const branchCount = 0;
    const blossomCount = particles.length;

    particles.forEach((particle, index) => {
      let target;
      if (index < branchCount) {
        const p = choose(tree.branches);
        target = { ...p, type: 'branch' };
      } else if (index < branchCount + blossomCount) {
        const p = choose(tree.blossoms);
        target = { ...p, type: 'sphere' };
      } else {
        const p = choose(tree.falling);
        target = { ...p, type: 'falling' };
      }
      particle.target = target;
    });
  }

  function getScrollProgress() {
    const maxScroll = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
    return clamp(window.scrollY / maxScroll, 0, 1);
  }

  function draw(timestamp) {
    const time = timestamp * 0.001;
    const cx = W / 2;
    const cy = H / 2;
    const progress = getScrollProgress();
    const transition = smoothstep(clamp(progress / 0.74, 0, 1));
    const treeVisible = smoothstep(clamp((progress - 0.58) / 0.24, 0, 1));
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const galaxyRotation = reducedMotion ? 0 : -time * 0.15;
    const treeRotation = reducedMotion ? 0 : time * 0.11;
    const treePitch = 0;

    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#020108';
    ctx.fillRect(0, 0, W, H);

    const galaxyGlow = 1 - transition;
    if (galaxyGlow > 0.01) {
      const glow = ctx.createRadialGradient(cx, cy, 24, cx, cy, Math.min(W, H) * 0.68);
      glow.addColorStop(0, `rgba(88, 78, 176, ${0.12 * galaxyGlow})`);
      glow.addColorStop(0.52, `rgba(51, 37, 110, ${0.06 * galaxyGlow})`);
      glow.addColorStop(1, 'rgba(2, 1, 8, 0)');
      ctx.save();
      ctx.scale(1, 0.5);
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(cx, cy / 0.5, Math.min(W, H) * 0.68, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // A muted pink aura arrives only after the galaxy begins to resolve into blossoms.
    if (treeVisible > 0.01) {
      const treeGlow = ctx.createRadialGradient(cx, cy - Math.min(W, H) * 0.10, 5, cx, cy - Math.min(W, H) * 0.1, Math.min(W, H) * 0.58);
      treeGlow.addColorStop(0, `rgba(142, 76, 105, ${0.06 * treeVisible})`);
      treeGlow.addColorStop(0.6, `rgba(76, 43, 67, ${0.025 * treeVisible})`);
      treeGlow.addColorStop(1, 'rgba(2, 1, 8, 0)');
      ctx.fillStyle = treeGlow;
      ctx.fillRect(0, 0, W, H);
    }

    for (const particle of particles) {
      const a = particle.angle + galaxyRotation;
      const gx = cx + Math.cos(a) * particle.dist + Math.cos(a + Math.PI / 2) * particle.spread;
      const gy = cy + (Math.sin(a) * particle.dist + Math.sin(a + Math.PI / 2) * particle.spread) * 0.45;
      const liveX = reducedMotion ? 0 : Math.sin(time * 0.8 + particle.orbitPhase) * particle.amp;
      const liveY = reducedMotion ? 0 : Math.cos(time * 0.6 + particle.orbitPhase) * particle.amp;
      const target = particle.target;

      let tx = target.x;
      let ty = target.y;
      let tz = target.z;
      if (!reducedMotion && target.type === 'blossom') {
        tx += Math.sin(time * 0.76 + target.phase) * target.sway * 0.9;
        ty += Math.cos(time * 0.58 + target.phase) * target.sway * 0.34;
      } else if (!reducedMotion && target.type === 'branch' && target.wavePhase !== undefined) {
        // Slow, offset waves travel down each tentacle independently.
        const tentacleWave = Math.sin(time * 0.52 + target.wavePhase + ty * 0.018) * target.waveAmount;
        tx += tentacleWave;
        ty += Math.sin(time * 0.38 + target.wavePhase + ty * 0.012) * target.waveAmount * 0.18;
        tz += Math.cos(time * 0.42 + target.wavePhase + ty * 0.014) * target.waveAmount * 0.82;
      } else if (!reducedMotion && target.type === 'falling') {
        const fall = (time * target.speed + target.offset) % (Math.min(W, H) * 0.79);
        tx += Math.sin(time * 1.1 + target.phase + fall * 0.032) * (10 + Math.abs(target.drift)) + target.drift * (fall / Math.min(W, H));
        ty += fall;
      }

      // Rotate a real volumetric point cloud around both the vertical and horizontal axes.
      const yawX = tx * Math.cos(treeRotation) + tz * Math.sin(treeRotation);
      const yawZ = -tx * Math.sin(treeRotation) + tz * Math.cos(treeRotation);
      const pitchY = ty * Math.cos(treePitch) - yawZ * Math.sin(treePitch);
      const pitchZ = ty * Math.sin(treePitch) + yawZ * Math.cos(treePitch);
      const perspective = 1 / (1 + pitchZ / (Math.min(W, H) * 3.2));
      const finalX = cx + yawX * perspective;
      const finalY = cy + pitchY * perspective;
      const currentX = mix(gx + liveX, finalX, transition);
      const currentY = mix(gy + liveY, finalY, transition);
      const currentSize = mix(particle.size, target.size * perspective, transition);
      const opacity = transition < 0.18 ? 1 : 0.8 + 0.2 * Math.sin(transition * Math.PI);

      ctx.globalAlpha = opacity;
      ctx.fillStyle = transition < 0.46 ? particle.color : target.color;
      ctx.beginPath();
      ctx.arc(currentX, currentY, currentSize, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.globalAlpha = 1;
    hint.style.opacity = String(1 - smoothstep(clamp((progress - 0.08) / 0.16, 0, 1)));
    lastScroll = progress;
    requestAnimationFrame(draw);
  }

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 1.5);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = `${W}px`;
    canvas.style.height = `${H}px`;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    initParticles();
  }

  window.addEventListener('resize', resize, { passive: true });
  resize();
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
